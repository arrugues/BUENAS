name: Build Android APK

on:
  push:
    branches: [ main, apk-build-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libtool \
          autoconf \
          automake \
          pkg-config \
          m4 \
          cmake \
          gettext \
          openjdk-17-jdk \
          openjdk-17-jdk-headless \
          ffmpeg \
          libffi-dev \
          libssl-dev \
          libxml2-dev \
          libxslt1-dev \
          zlib1g-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer cython==0.29.33 pyjnius

    - name: Create buildozer.spec if missing
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi

    - name: Build APK with Buildozer
      run: |
        set +o pipefail
        yes | buildozer android debug 2>&1 | tee build.log
        exit_code=${PIPESTATUS[0]}
        echo "Build exit code: $exit_code"
        exit $exit_code
      timeout-minutes: 120
      continue-on-error: true

    - name: Check if APK was created
      run: |
        if ls bin/*.apk 1> /dev/null 2>&1; then
          echo "APK found!"
          ls -lah bin/*.apk
        else
          echo "No APK found. Checking build logs..."
          tail -100 build.log || true
          exit 1
        fi

    - name: Upload APK as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: BUENAS-APK
        path: bin/*.apk
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build.log
        retention-days: 7
